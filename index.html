<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Meta Ray-Ban Display: fixed 600x600, no user scaling. -->
    <!--
      device-width, NOT a hardcoded 600x600. Forcing the layout viewport made
      every device report 600x600 to JS and CSS, so a phone was indistinguishable
      from the glasses and got the fixed square shell. The glasses report 600
      naturally, and the glasses surface is a fixed 600px in CSS regardless.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#000000" />
    <!-- Warm up the image CDN + source host so the first card image loads faster. -->
    <link rel="preconnect" href="https://wsrv.nl" crossorigin />
    <link rel="preconnect" href="https://images.pokemontcg.io" crossorigin />
    <meta
      name="description"
      content="CardLens — search Pokémon cards and see market pricing on Meta Ray-Ban Display glasses."
    />
    <title>CardLens</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>CardLens requires JavaScript.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
