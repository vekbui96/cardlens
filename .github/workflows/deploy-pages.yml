name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One concurrent Pages deployment; don't cancel an in-progress publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build (Pages)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with Pages base path
        run: npm run build
        env:
          # Served from https://<user>.github.io/cardlens/
          VITE_BASE: /cardlens/
          # No companion server on Pages — hide the dev panel for a clean public demo.
          VITE_ENABLE_DEV_PANEL: "false"
          # Companion relay URL. Set repo variable COMPANION_API_BASE_URL to your
          # deployed server (e.g. https://cardlens-server.onrender.com/api) to enable
          # phone input; falls back to "/api" (companion disabled on Pages) otherwise.
          VITE_COMPANION_API_BASE_URL: ${{ vars.COMPANION_API_BASE_URL || '/api' }}
      - name: SPA fallback (deep links like /privacy, /input/:code)
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy (Pages)
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
